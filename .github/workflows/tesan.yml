name: 태산 스캔 → tesan_auto
run-name: "태산 스캔${{ format('{0}', inputs.sync) == 'true' && ' (수동 동기화·알림 없음)' || '' }}${{ format('{0}', inputs.test) == 'true' && ' (테스트 강제발송)' || '' }}"
# (2026-11-26 이전: tesan_auto/.github/workflows/scan.yml) cron-job.org 가 평일 15:55 KST 에 dispatch 한다. body {"ref":"main"}
# 스캔 → 커밋 → Cloudflare Pages 배포를 먼저 끝내고, 16:10 KST 보고 시각까지 기다렸다가 텔레그램 보고.
# sync = 페이지의 🔄 수동 동기화(스캔+페이지만, 보고·텔레그램 없음).
# 공개 저장소라 로그도 공개 → 스크립트 출력(종목·보고 내용)은 로그에 남기지 않는다.
on:
  workflow_dispatch:
    inputs:
      test:
        description: "알림 강제 발송(테스트)"
        type: boolean
        default: false
      sync:
        description: "수동 동기화 (스캔+페이지만, 보고·텔레그램 생략)"
        type: boolean
        default: false
concurrency: { group: tesan-scan, cancel-in-progress: false }
permissions: { contents: read }   # 쓰기는 PRIVATE_REPO_TOKEN 으로 tesan_auto 에
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chany2m4655/tesan_auto   # 비공개 저장소 (코드·데이터·상태는 그대로 거기 있음)
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - name: 스캔 → 필터 → 페이지 (출력은 로그에 남기지 않음)
        working-directory: scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ inputs.test }}
        run: |
          cp page_data.json /tmp/prev.json || true
          q() { if "$@" > /tmp/out.log 2>&1; then rc=0; else rc=$?; echo "::warning::$* 실패 — $(tail -n1 /tmp/out.log | cut -c1-200)"; fi; echo "$* → exit $rc ($(wc -l < /tmp/out.log)줄)"; return $rc; }
          q python scan_v4.py
          q python filter_pansuh.py
          q python mock.py || true
          q timeout 300 python realsim.py tesan real_tesan.json realsim_state.json || echo "실전모의 실패/시간초과"
          q python mock_chart.py || true
          q python build_page.py
      - name: 커밋 → tesan_auto
        run: |
          git config user.name "tesan-bot"
          git config user.email "tesan-bot@users.noreply.github.com"
          git add docs/index.html scan/page_data.json scan/mock_book.json scan/mock_data.json scan/mock_chart.json scan/real_tesan.json scan/realsim_state.json
          git commit -q -m "스캔 $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          for i in 1 2 3; do
            git pull -q --rebase -X ours && git push -q && exit 0
            sleep 5
          done
          echo "push 실패(3회)"; exit 1
      - name: Cloudflare Pages 배포 (tesan-auto.pages.dev)
        id: cf
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::secret CLOUDFLARE_API_TOKEN 이 없습니다"; exit 1; fi
          # docs/ + 올스토커 모의투자 탭용 scan/*.json. functions/ (/api/sync) 는 저장소 루트에서 실행해야 함께 배포됨
          rm -rf /tmp/site && mkdir -p /tmp/site/scan && cp -r docs/. /tmp/site/
          cp scan/mock_data.json scan/mock_chart.json scan/page_data.json scan/real_tesan.json /tmp/site/scan/ 2>/dev/null || true
          npx -y wrangler@4 pages deploy /tmp/site --project-name tesan-auto --branch main --commit-dirty=true
      - name: 보고 시각까지 대기
        if: ${{ format('{0}', inputs.sync) != 'true' }}
        env: { FORCE_REPORT: '${{ inputs.test }}' }
        run: python wait_report.py 16:10 15
      - name: 텔레그램 보고
        if: ${{ env.SKIP_REPORT != '1' && format('{0}', inputs.sync) != 'true' }}
        working-directory: scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ inputs.test }}
        run: |
          python notify.py /tmp/prev.json > /tmp/notify.log 2>&1 && rc=0 || rc=$?
          echo "notify exit $rc · $(grep -o 'telegram [0-9]*\|알림 없음\|텔레그램 설정 없음' /tmp/notify.log | head -1)"
