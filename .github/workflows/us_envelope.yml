name: 미국엔벨롭 갱신 → US_envelope
run-name: "미국엔벨롭 갱신${{ format('{0}', inputs.sync) == 'true' && ' (수동 동기화·알림 없음)' || '' }}"
# (2026-11-26 이전: US_envelope/.github/workflows/update.yml) cron-job.org 가 화~토 09:00 KST 에 dispatch 한다. body {"ref":"main"}
# 스캔 → 커밋 → Cloudflare Pages 배포 → 09:10 KST 보고 시각까지 대기 → 텔레그램 보고.
# sync = 페이지의 🔄 수동 동기화(스캔+페이지만, 보고·텔레그램 없음).
# 공개 저장소라 로그도 공개 → 스크립트 출력(종목·판정·보고 내용)은 로그에 남기지 않는다.
on:
  workflow_dispatch:
    inputs:
      sync:
        description: "수동 동기화 (스캔+페이지만, 보고·텔레그램 생략)"
        type: boolean
        default: false
concurrency: { group: us-envelope-update, cancel-in-progress: false }
permissions: { contents: read }   # 쓰기는 PRIVATE_REPO_TOKEN 으로 US_envelope 에
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chany2m4655/US_envelope   # 비공개 저장소 (코드·데이터·상태는 그대로 거기 있음)
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: 스캔 → 판정 → 페이지 (출력은 로그에 남기지 않음)
        run: |
          q() { if "$@" > /tmp/out.log 2>&1; then rc=0; else rc=$?; echo "::warning::$* 실패 — $(tail -n1 /tmp/out.log | cut -c1-200)"; fi; echo "$* → exit $rc ($(wc -l < /tmp/out.log)줄)"; return $rc; }
          q python scan2.py
          q python auto_judge.py
          q python build_page_data.py
          q python sim_us.py
          mkdir -p docs && { q timeout 300 python realsim.py us docs/real_us.json realsim_state_us.json || echo '실전모의 실패'; }
          q python build_docs.py
      - name: 커밋 → US_envelope
        run: |
          git config user.name "envelope-bot"
          git config user.email "actions@github.com"
          git add page_data.json verdicts.json last_scan2.json sim_us.json sim_elig.json docs realsim_state_us.json
          git commit -q -m "data $(date -u +%F)" || echo "no changes"
          for i in 1 2 3; do
            git pull -q --rebase -X ours && git push -q && exit 0
            sleep 5
          done
          echo "push 실패(3회)"; exit 1
      - name: Cloudflare Pages 배포 (us-envelope.pages.dev)
        id: cf
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::secret CLOUDFLARE_API_TOKEN 이 없습니다"; exit 1; fi
          # functions/ (/api/sync) 는 저장소 루트에서 실행해야 함께 배포됨
          npx -y wrangler@4 pages deploy docs --project-name us-envelope --branch main --commit-dirty=true
      - name: 보고 시각까지 대기
        if: ${{ format('{0}', inputs.sync) != 'true' }}
        run: python wait_report.py 09:10 10
      - name: 텔레그램 보고
        if: ${{ env.SKIP_REPORT != '1' && format('{0}', inputs.sync) != 'true' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python notify.py > /tmp/notify.log 2>&1 && rc=0 || rc=$?
          echo "notify exit $rc · telegram $(head -n1 /tmp/notify.log | cut -d' ' -f1 | cut -c1-30)"
